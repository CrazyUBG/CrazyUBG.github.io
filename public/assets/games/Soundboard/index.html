<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Soundboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    /* Controls row */
    .controls-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stop-btn {
      background-color: #dc2626;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s ease;
    }

    .stop-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
    }

    .stop-btn:active {
      transform: translateY(2px) scale(0.95);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    /* Overlap toggle button */
    .overlap-btn {
      background-color: #334155;
      color: white;
      border: 2px solid #475569;
      border-radius: 999px;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .overlap-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
    }

    .overlap-btn:active {
      transform: translateY(2px) scale(0.95);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .overlap-btn.active {
      background-color: #16a34a;
      border-color: #22c55e;
    }

    /* Section switch button (Music <-> Memes) */
    .nav-btn {
      background-color: #7c3aed;
      color: white;
      border: 2px solid #a78bfa;
      border-radius: 999px;
      padding: 0.8rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s ease;
    }

    .nav-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:active {
      transform: translateY(2px) scale(0.95);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .section[hidden] {
      display: none;
    }

    .empty-note {
      max-width: 520px;
      text-align: center;
      line-height: 1.5;
      opacity: 0.8;
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 16px;
    }

    .soundboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 800px;
    }

    /* Round Button Styling */
    .sound-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      text-align: center;
      justify-self: center;
    }

    .sound-btn:hover {
      filter: brightness(1.15);
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
    }

    .sound-btn:active {
      transform: translateY(2px) scale(0.95);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .emoji {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }
  </style>
</head>

        src: ""
      }
    ];

    // Web Audio API Setup for Synthesized Sounds
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    
    const activeAudios = new Set();
    const activeSynths = new Set();

    
    let overlapEnabled = false;

    function playSynthSound(startFreq, endFreq, duration) {
      if (!overlapEnabled) {
        stopAllSounds();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), audioCtx.currentTime + duration);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const synth = { osc, gain };
      activeSynths.add(synth);
      osc.onended = () => {
        activeSynths.delete(synth);
        gain.disconnect();
      };

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playAudioFile(src) {
      if (!overlapEnabled) {
        stopAllSounds();
      }

      const audio = new Audio(src);
      activeAudios.add(audio);
      audio.addEventListener('ended', () => activeAudios.delete(audio));
      audio.addEventListener('error', () => activeAudios.delete(audio));
      audio.play().catch(e => {
        activeAudios.delete(audio);
        console.error("Error playing audio file:", e);
      });
    }

    function stopAllSounds() {
      // Stop audio files
      activeAudios.forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
      activeAudios.clear();

      // Stop synthesized sounds
      activeSynths.forEach(({ osc, gain }) => {
        try { osc.stop(); } catch (e) { /* already stopped */ }
        gain.disconnect();
      });
      activeSynths.clear();
    }

    // Stop button + Escape key shortcut
    document.getElementById('stopAll').addEventListener('click', stopAllSounds);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') stopAllSounds();
    });

    // Overlap toggle button
    const overlapBtn = document.getElementById('overlapToggle');
    overlapBtn.addEventListener('click', () => {
      overlapEnabled = !overlapEnabled;
      overlapBtn.textContent = `🔁 Overlap: ${overlapEnabled ? 'ON' : 'OFF'}`;
      overlapBtn.classList.toggle('active', overlapEnabled);
    });

    // Build a grid of round buttons from a list of sounds
    function buildButtons(list, container) {
      list.forEach(sound => {
        const btn = document.createElement('button');
        btn.className = 'sound-btn';
        btn.style.backgroundColor = sound.color;
        btn.innerHTML = `<span class="emoji">${sound.emoji || ''}</span><span>${sound.name}</span>`;

        btn.addEventListener('click', () => {
          if (sound.type === 'synth') {
            playSynthSound(sound.freq, sound.endFreq, sound.duration);
          } else if (sound.type === 'audio') {
            playAudioFile(sound.src);
          }
        });

        container.appendChild(btn);
      });
    }

    buildButtons(MEME_SOUNDS, document.getElementById('soundboard'));
    buildButtons(MUSIC_TRACKS, document.getElementById('musicboard'));
    document.getElementById('musicEmpty').hidden = MUSIC_TRACKS.length > 0;

    // Section switching (Memes <-> Music)
    const memeSection = document.getElementById('memeSection');
    const musicSection = document.getElementById('musicSection');
    const navBtn = document.getElementById('navBtn');
    const pageTitle = document.getElementById('pageTitle');
    let showingMusic = false;

    navBtn.addEventListener('click', () => {
      showingMusic = !showingMusic;
      stopAllSounds(); // don't carry sounds over into the other section
      memeSection.hidden = showingMusic;
      musicSection.hidden = !showingMusic;
      navBtn.textContent = showingMusic ? 'Back to Meme Sounds' : '🎵 Go to Music (UNFINISHED)';
      pageTitle.textContent = showingMusic ? '🎵 Music' : '🔊 Meme Soundboard (BETA)';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
